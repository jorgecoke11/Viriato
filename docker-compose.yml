services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/Viariato.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__SigningKey: ${Jwt__SigningKey}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes}
      Auth__RefreshTokenDays: ${Auth__RefreshTokenDays}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins}
      Bootstrap__AdminEmail: ${Bootstrap__AdminEmail}
      Bootstrap__AdminPassword: ${Bootstrap__AdminPassword}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      # Reachable service-to-service name inside the compose network — the host-facing
      # VITE_API_URL in .env (http://localhost:8080) only makes sense outside Docker.
      VITE_API_URL: http://api:8080
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
