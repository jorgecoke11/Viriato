services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/Viariato.Api/Dockerfile
      args:
        # Set on the host before building, e.g.:
        #   APP_VERSION=$(cat VERSION) GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build api
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__SigningKey: ${Jwt__SigningKey}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes}
      Auth__RefreshTokenDays: ${Auth__RefreshTokenDays}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins}
      Bootstrap__AdminEmail: ${Bootstrap__AdminEmail}
      Bootstrap__AdminPassword: ${Bootstrap__AdminPassword}
      Markets__UserAgent: ${Markets__UserAgent}
      Markets__SyncRequestDelayMs: ${Markets__SyncRequestDelayMs}
      Markets__DiscountRatePercent: ${Markets__DiscountRatePercent}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      # Reachable service-to-service name inside the compose network — the host-facing
      # VITE_API_URL in .env (http://localhost:8080) only makes sense outside Docker.
      VITE_API_URL: http://api:8080
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
