# El lanzador de robots para una máquina QUE NO ES la de Viriato. En el servidor de Viriato no hace falta nada de esto: el lanzador ya
# viene en docker-compose.prod.yml y los robots se suben en Viriato (RPA → Despliegues). Ver docs/lanzador-de-robots.md.
#
# Aquí los robots van en una carpeta con su catálogo (robots.json) y cada uno con la clave de su despliegue en .env:
#   Copy-Item .env.example .env                       # y rellena las claves
#   Copy-Item robots.example.json robots\robots.json  # el catálogo, junto a las carpetas de los robots
#   docker compose up -d --build
#   docker compose logs -f

services:
  lanzador:
    build:
      context: ../../backend
      dockerfile: sdk/Viriato.Rpa.Lanzador/Dockerfile
      # «ligero» (solo .NET) o «navegador» (además Edge y pantalla virtual; solo linux/amd64).
      target: ${LANZADOR_IMAGEN:-ligero}
    image: viriato-lanzador:${LANZADOR_IMAGEN:-ligero}
    # Recoge los procesos que dejan los robots al terminar (un navegador, la vista en directo).
    init: true
    # Las claves de los robots: una variable por robot, la que nombra su "claveEnv" en el catálogo.
    env_file: .env
    environment:
      VIRIATO_URL: ${VIRIATO_URL:-http://host.docker.internal:8080}
    volumes:
      # El catálogo (robots.json) y una carpeta por robot con su publicación (dotnet publish).
      - ${ROBOTS_DIR:-./robots}:/robots:ro
      - selenium-cache:/home/robot/.cache/selenium
    ports:
      # La pantalla del primer robot con navegador (noVNC), solo desde este PC. El segundo usaría el 6081.
      - "127.0.0.1:${VISTA_PUERTO:-6080}:6080"
    # Edge necesita memoria compartida de verdad, y /tmp limpio en cada arranque (pantallas virtuales, perfiles, descargas, vídeo).
    shm_size: 1gb
    tmpfs:
      - /tmp:exec,mode=1777,size=1g
    # El tope de TODO lo que corre aquí: el lanzador y los robots que tenga arrancados en cada momento.
    mem_limit: ${LANZADOR_MEMORIA:-3g}
    cpus: ${LANZADOR_CPUS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Al parar, cada robot termina (o da por fallido) lo que tiene entre manos.
    stop_grace_period: 2m

volumes:
  selenium-cache:
